# =============================================================================
# Sharky TUI Standalone Build & Package Pipeline
# =============================================================================
# Automates compiling the lightweight terminal client (Rust + Ratatui + Tokio).
# Produces native standalone executables that connect to any Sharky backend
# service via SHARKY_API_URL or localhost:8000.
#
# Generated Artifacts:
#   - Linux:   sharky-tui-linux-x86_64
#   - Windows: sharky-tui-windows-x86_64.exe
#
# Optimization Tips:
#   - swatinem/rust-cache caches the target directory to drastically shorten
#     incremental build times across pipeline runs.
#   - Binaries are built with `--release` flags for optimal terminal rendering
#     and low memory footprint.
# =============================================================================

name: "Build TUI"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (compile without publishing to release)"
        type: boolean
        default: false

concurrency:
  group: tui-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-tui:
    name: "Build TUI (${{ matrix.platform }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary_name: sharky-tui
            artifact_name: sharky-tui-linux-x86_64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: sharky-tui.exe
            artifact_name: sharky-tui-windows-x86_64.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Caching cargo dependencies & target artifacts
      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "TUI -> target"

      # Build TUI in release mode
      - name: Compile TUI Binary (cargo build --release)
        working-directory: TUI
        run: cargo build --release --target ${{ matrix.target }}

      # Prepare and rename binary for publication
      - name: Stage Binary (Linux)
        if: runner.os != 'Windows'
        run: |
          cp TUI/target/${{ matrix.target }}/release/${{ matrix.binary_name }} ./${{ matrix.artifact_name }}
          chmod +x ./${{ matrix.artifact_name }}

      - name: Stage Binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "TUI/target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "./${{ matrix.artifact_name }}"

      # Upload workflow artifact for inspection
      - name: Upload TUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ./${{ matrix.artifact_name }}
          retention-days: 7

      # Publish directly to GitHub Release
      - name: Attach TUI Binary to Release
        if: github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ./${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
