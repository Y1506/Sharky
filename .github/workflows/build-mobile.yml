# =============================================================================
# Sharky Mobile Application (Android APK) Build Pipeline
# =============================================================================
# Automates compiling the React Native (Expo) mobile frontend into an installable
# Android APK package.
#
# Generated Artifacts:
#   - Android: sharky-mobile.apk
#
# Architecture & Fallback Strategy:
#   - When EXPO_TOKEN is provided: Uses Expo Application Services (EAS) CLI.
#   - When EXPO_TOKEN is NOT provided (local runner build):
#     Uses Expo Prebuild to generate the native Android project, then compiles
#     a standalone installable APK using Gradle and the pre-installed Android SDK.
# =============================================================================

name: "Build Mobile APK"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (compile without publishing to release)"
        type: boolean
        default: false

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: "Build Android APK"
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Tip: Node.js 22 LTS for Expo SDK 52 compatibility
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # Pre-installed Android SDK license acceptance
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Install Mobile Frontend dependencies
      - name: Install Mobile Dependencies
        working-directory: Frontend/Mobile
        run: npm install

      # Compile the Android APK (via EAS cloud if token exists, or native Gradle build)
      - name: Build Android APK Package
        working-directory: Frontend/Mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "Building APK using EAS Build..."
            npm install -g eas-cli
            eas build --platform android --profile preview --non-interactive --wait --output sharky-mobile.apk || \
            npx eas-cli build --platform android --profile preview --local --non-interactive --output sharky-mobile.apk
          else
            echo "Notice: EXPO_TOKEN not set. Building native APK on runner via Gradle..."
            npx expo prebuild --platform android --clean
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
            cd ..
            APK_FILE=$(find android/app/build/outputs/apk -name "*.apk" -type f | head -1)
            if [ -n "$APK_FILE" ] && [ -f "$APK_FILE" ]; then
              echo "Found APK at: $APK_FILE"
              cp "$APK_FILE" sharky-mobile.apk
            else
              echo "Error: No APK file was generated by Gradle"
              exit 1
            fi
          fi

      # Stage APK for upload
      - name: Verify APK Generated
        working-directory: Frontend/Mobile
        run: |
          if [ -f "sharky-mobile.apk" ]; then
            echo "sharky-mobile.apk exists and is ready for upload."
            ls -lh sharky-mobile.apk
          else
            echo "Error: sharky-mobile.apk not found!"
            exit 1
          fi

      # Upload workflow artifact for direct download
      - name: Upload APK Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sharky-mobile-apk
          path: Frontend/Mobile/sharky-mobile.apk
          retention-days: 7

      # Attach APK to GitHub Release
      - name: Attach APK to GitHub Release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: Frontend/Mobile/sharky-mobile.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
