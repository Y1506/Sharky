[package]
name = "sharky-tui"
version = "0.1.0"
edition = "2021"
authors = ["Sharky Core Team"]
description = "High-performance Rust Terminal User Interface for Sharky Download Manager"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1.42", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"
anyhow = "1.0"
