services:
  sharky-backend:
    build: ./Backend
    container_name: sharky-backend
    volumes:
      - ./downloads:/downloads
      # Mount your cookie file from host into the container if available:
      - ./cookies.txt:/app/cookies.txt:ro
    stdin_open: true
    tty: true
    # Host networking allows aria2c RPC to work seamlessly
    network_mode: host
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    command: ["server"]
